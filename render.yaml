# Render blueprint for the pilot (Starter plan). Secrets are set in the dashboard (sync: false).
services:
  - type: web
    name: aqarchat
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # glibc arena cap: flyer rendering peak RSS ~250 MB instead of ~410 MB (scripts/render-flyer-samples.js).
      - key: MALLOC_ARENA_MAX
        value: "2"
      # Optional until the domain exists: without it the app uses Render's RENDER_EXTERNAL_URL
      # (https://<service>.onrender.com). Set it to the real domain once one exists.
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      # WhatsApp is off by default; set to "true" to turn the bot back on (the WHATSAPP_* keys below are then required).
      - key: WHATSAPP_ENABLED
        value: "false"
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
