<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; }
        body {
            width: 1080px;
            height: 1920px;
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            font-family: 'Cairo', sans-serif, Arial;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .hero-section {
            position: relative;
            width: 1080px;
            height: 820px;
            flex-shrink: 0;
        }
        .hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .gradient-overlay {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 300px;
            background: linear-gradient(to top, #0f172a, transparent);
        }

        /* Gallery strip: 1, 2 or 3 thumbnails, always full width */
        .gallery {
            display: grid;
            gap: 8px;
            width: 1080px;
            height: 280px;
            flex-shrink: 0;
            margin-top: 8px;
        }
        .gallery.g1 { grid-template-columns: 1fr; }
        .gallery.g2 { grid-template-columns: repeat(2, 1fr); }
        .gallery.g3 { grid-template-columns: repeat(3, 1fr); }
        .gallery img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
        }

        .content-box {
            padding: 36px 60px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }
        .price-tag {
            font-size: 56px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 10px;
        }
        .title {
            font-size: 42px;
            font-weight: bold;
        }
        .specs-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 28px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .spec-item {
            font-size: 28px;
            color: #cbd5e1;
        }
        .footer-card {
            background: #1e293b;
            padding: 36px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid #334155;
            flex-shrink: 0;
        }
        .agent-info h3 { margin: 0; font-size: 34px; color: #f8fafc; }
        .agent-info p { margin: 10px 0 0 0; font-size: 26px; color: #94a3b8; direction: ltr; text-align: right; }
        .badge {
            background: #0284c7;
            color: white;
            padding: 10px 25px;
            border-radius: 50px;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="hero-section">
        <img src="{{IMAGE_URL}}" class="hero-img" />
        <div class="gradient-overlay"></div>
    </div>

    {{GALLERY}}

    <div class="content-box">
        <div>
            <div class="price-tag">{{PRICE}}</div>
            <div class="title">{{TITLE}}</div>
        </div>

        <div class="specs-grid">
            <div class="spec-item">📐 المساحة: {{AREA}}</div>
            <div class="spec-item">🛏️ الغرف: {{ROOMS}}</div>
            <div class="spec-item">🏢 الدور: {{FLOOR}}</div>
            <div class="spec-item">📍 المنطقة: {{LOCATION}}</div>
        </div>
    </div>

    <div class="footer-card">
        <div class="agent-info">
            <h3>{{AGENT_NAME}}</h3>
            <p>{{AGENT_PHONE}}</p>
        </div>
        <div class="badge">للإستعلام والتواصل</div>
    </div>
</body>
</html>
